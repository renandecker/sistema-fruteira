quarkus.http.port=8082
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
# ---- Banco de dados: o schema é criado/atualizado pelo FLYWAY do retaguarda-service (dono das migrations; precisa subir antes deste). ----
# Aqui o Hibernate só CONFERE (validate): se uma @Entity não bater com o banco, o serviço não sobe. Mudou uma @Entity? Crie a migration com
# ./database/nova-migration.sh estoque "descrição" (ela fica no retaguarda-service). Emergência: DB_SCHEMA_MODE=update.
quarkus.hibernate-orm.database.generation=${DB_SCHEMA_MODE:validate}
quarkus.rest-client.catalogo.url=http://localhost:8081

# ---- DEV: H2 em arquivo compartilhado (../data/fruteira, igual ao banco único da produção), não precisa de Docker ----
# Dev: PostgreSQL local em Docker (docker-compose.yml) por padrão; USAR_DOCKER=false no .env faz o iniciar trocar para H2 em arquivo (DEV_DB_KIND/DEV_DB_URL).
%dev.quarkus.datasource.db-kind=${DEV_DB_KIND:postgresql}
%dev.quarkus.datasource.jdbc.url=${DEV_DB_URL:jdbc:postgresql://localhost:5432/fruteira}
%dev.quarkus.datasource.username=${DB_USER:fruteira}
%dev.quarkus.datasource.password=${DB_PASS:fruteira}
%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.live-reload.instrumentation=false
# ---- PROD: PostgreSQL (variáveis de ambiente) ----
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/fruteira}
%prod.quarkus.datasource.username=${DB_USER:postgres}
%prod.quarkus.datasource.password=${DB_PASS:fruteira}

# ================= SEGURANÇA =================
# DEV: sem token (sem autenticação nas APIs; o front informa X-Usuario/X-Perfil)
%dev.quarkus.smallrye-jwt.enabled=false
%dev.fruteira.seed=true
# PROD: token JWT (HS256) emitido pelo retaguarda no login (POST /usuarios/login); os 4 serviços validam com o MESMO segredo, num arquivo JWK criado pelo launcher (JWT_VERIFY_JWK)
%prod.smallrye.jwt.verify.key.location=${JWT_VERIFY_JWK:/etc/fruteira/jwt.jwk}
%prod.smallrye.jwt.verify.algorithm=HS256
%prod.mp.jwt.verify.issuer=fruteira
%prod.quarkus.http.cors.origins=${FRONT_URL:http://localhost:5173}
# repassa o token do usuário nas chamadas entre microsserviços
%prod.org.eclipse.microprofile.rest.client.propagateHeaders=Authorization
%prod.quarkus.http.auth.policy.nivel-operador.roles-allowed=operador,supervisor,gerente
%prod.quarkus.http.auth.policy.nivel-supervisor.roles-allowed=supervisor,gerente
%prod.quarkus.http.auth.policy.nivel-gerente.roles-allowed=gerente
%prod.quarkus.http.auth.permission.baixa.paths=/estoque/baixa
%prod.quarkus.http.auth.permission.baixa.methods=POST
%prod.quarkus.http.auth.permission.baixa.policy=nivel-operador
%prod.quarkus.http.auth.permission.escrita.paths=/estoque/entrada,/estoque/producao
%prod.quarkus.http.auth.permission.escrita.methods=POST
%prod.quarkus.http.auth.permission.escrita.policy=nivel-supervisor
%prod.quarkus.http.auth.permission.saldo.paths=/estoque/*
%prod.quarkus.http.auth.permission.saldo.methods=GET,HEAD
%prod.quarkus.http.auth.permission.saldo.policy=nivel-operador
%prod.quarkus.http.auth.permission.relatorios.paths=/estoque/relatorio/*
%prod.quarkus.http.auth.permission.relatorios.methods=GET,HEAD
%prod.quarkus.http.auth.permission.relatorios.policy=nivel-gerente
%prod.quarkus.http.auth.permission.fallback.paths=/*
%prod.quarkus.http.auth.permission.fallback.policy=authenticated

# DEV: nenhum Dev Service (Docker): o banco vem do docker-compose.yml ou do H2, nunca de um contêiner iniciado pelo Quarkus
%dev.quarkus.devservices.enabled=false

# Auditoria central
quarkus.rest-client.auditoria.url=${RETAGUARDA_URL:http://localhost:8084}
quarkus.rest-client.auditoria.connect-timeout=2000
quarkus.rest-client.auditoria.read-timeout=3000

# Histórico de entradas (supervisor+)
%prod.quarkus.http.auth.permission.entradas.paths=/estoque/entradas
%prod.quarkus.http.auth.permission.entradas.methods=GET,HEAD
%prod.quarkus.http.auth.permission.entradas.policy=nivel-supervisor

# OpenTelemetry (traces; logs ganham trace_id). DESLIGADO por padrão: o launcher liga com OTEL_ENABLED=true no .env
# (endpoint, protocolo, cabeçalhos e amostragem vêm de OTEL_* via QUARKUS_OTEL_*). Funciona com Dynatrace, Grafana Tempo/Alloy, Jaeger, etc.
quarkus.otel.sdk.disabled=true
quarkus.otel.traces.sampler=parentbased_traceidratio
quarkus.otel.traces.sampler.arg=0.1
quarkus.otel.traces.suppress-application-uris=/q/*
