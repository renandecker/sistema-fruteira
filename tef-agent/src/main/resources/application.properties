# AGENTE TEF — roda no computador do caixa (junto do pinpad). Escuta SOMENTE em 127.0.0.1.
quarkus.http.port=8090
quarkus.http.host=127.0.0.1
quarkus.http.cors.enabled=true
# O navegador do caixa chama o agente direto; libere só a origem do front (em produção: FRONT_URL do .env)
quarkus.http.cors.origins=${TEF_ORIGENS:${FRONT_URL:http://localhost:5173,http://127.0.0.1:5173}}
quarkus.http.cors.headers=Content-Type,X-Tef-Token
quarkus.http.cors.methods=GET,POST,OPTIONS
%dev.quarkus.devservices.enabled=false

# Provedor TEF: simulador (testes/homologação interna) | clisitef (a implementar com a DLL licenciada)
tef.provider=${TEF_PROVIDER:simulador}
# Token compartilhado com o front (Configurações → Balança e periféricos). Vazio = sem token (só use em desenvolvimento)
tef.agente.token=${TEF_TOKEN:}
tef.dados=${TEF_DADOS:./data/tef-agente.json}
tef.simulador.latencia-ms=${TEF_SIM_LATENCIA:1200}
# CNPJ FICTÍCIO da credenciadora no simulador. Com TEF real, vem do provedor.
tef.simulador.cnpj=00000000000191
