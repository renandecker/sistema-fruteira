# Infra de produção: Keycloak + PostgreSQL (+ nginx/HTTPS opcional: docker compose --profile nginx ...). Variáveis vindas do .env.
# Os microsserviços Quarkus rodam no host (iniciar.sh/.bat) e o nginx os alcança via host.docker.internal.
services:
  nginx:
    image: nginx:1.27-alpine
    profiles: ["nginx"]                      # só sobe com USE_NGINX=true
    ports: ["80:80", "443:443"]
    environment:
      FRONT_DOMAIN: ${FRONT_DOMAIN:-}
      KEYCLOAK_DOMAIN: ${KEYCLOAK_DOMAIN:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certs:/etc/letsencrypt:ro
      - ./pdv-web/dist:/usr/share/nginx/html:ro
    depends_on: [keycloak]
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASS:?defina KEYCLOAK_DB_PASS no .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?defina KEYCLOAK_ADMIN_PASSWORD no .env}
      KC_HOSTNAME: ${KEYCLOAK_URL:-http://localhost:8180}   # URL pública (emissor dos tokens)
      KC_HTTP_ENABLED: "true"                     # com nginx, o TLS termina nele
      KC_PROXY_HEADERS: xforwarded
      FRONT_URL: ${FRONT_URL:-http://localhost:5173}       # usado nos redirectUris do realm
    ports: ["127.0.0.1:8180:8080"]                # só local; o público passa pelo nginx
    volumes: ["./keycloak:/opt/keycloak/data/import:ro"]
    depends_on: [keycloak-db]
    restart: unless-stopped

  keycloak-db:
    image: postgres:16
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASS}
    volumes: [kcdata:/var/lib/postgresql/data]
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fruteira
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:?defina DB_PASS no .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped

volumes: { pgdata: {}, kcdata: {} }
