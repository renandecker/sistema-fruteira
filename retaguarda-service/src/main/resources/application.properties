quarkus.http.port=8084
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
# ---- Banco de dados: o FLYWAY roda SÓ AQUI (retaguarda-service é o dono das migrations dos 4 serviços, que dividem o mesmo banco). ----
# Migrations em src/main/resources/db/migration (V1, V2... numeração única; arquivo V<n>__<servico>_<descricao>.sql). O Hibernate só CONFERE (validate).
# Toda mudança em @Entity de QUALQUER serviço exige uma migration nova aqui (./database/nova-migration.sh). Emergência: DB_SCHEMA_MODE=update.
# Este serviço precisa subir ANTES dos outros (iniciar.sh/.bat já fazem isso): os demais só validam o schema que ele cria.
quarkus.hibernate-orm.database.generation=${DB_SCHEMA_MODE:validate}
quarkus.flyway.migrate-at-start=true
# baseline 0 = banco antigo (criado pelo Hibernate ou pelo Flyway por serviço) também roda tudo (as migrations são idempotentes)
quarkus.flyway.table=flyway_historico
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0
quarkus.flyway.locations=db/migration
# PRODUÇÃO: além do schema, carrega o PRÉ-CADASTRO de frutas e verduras (db/pre-cadastro). Para não carregar: FLYWAY_LOCATIONS=db/migration
%prod.quarkus.flyway.locations=${FLYWAY_LOCATIONS:db/migration,db/pre-cadastro}
%prod.quarkus.flyway.connect-retries=10
%prod.quarkus.flyway.connect-retries-interval=3S

%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:file:${H2_ARQUIVO:../data/fruteira};AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.live-reload.instrumentation=false
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/fruteira}
%prod.quarkus.datasource.username=${DB_USER:postgres}
%prod.quarkus.datasource.password=${DB_PASS:fruteira}

# ================= SEGURANÇA =================
# DEV: OIDC desligado (sem autenticação nas APIs; o login do front é local)
%dev.quarkus.oidc.enabled=false
%dev.fruteira.seed=true
# PROD: tokens do Keycloak (OIDC). Perfis = realm roles (gerente > supervisor > operador)
%prod.quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:fruteira}
%prod.quarkus.oidc.client-id=${KEYCLOAK_API_CLIENT:fruteira-api}
%prod.quarkus.oidc.application-type=service
%prod.quarkus.oidc.tls.verification=${OIDC_TLS_VERIFICATION:required}
%prod.quarkus.oidc.connection-delay=60S
%prod.quarkus.oidc.roles.role-claim-path=realm_access/roles
%prod.quarkus.http.cors.origins=${FRONT_URL:http://localhost:5173}
# repassa o token do usuário nas chamadas entre microsserviços
%prod.org.eclipse.microprofile.rest.client.propagateHeaders=Authorization
%prod.quarkus.http.auth.policy.nivel-operador.roles-allowed=operador,supervisor,gerente
%prod.quarkus.http.auth.policy.nivel-supervisor.roles-allowed=supervisor,gerente
%prod.quarkus.http.auth.policy.nivel-gerente.roles-allowed=gerente
%prod.quarkus.http.auth.permission.usuarios.paths=/usuarios,/usuarios/*
%prod.quarkus.http.auth.permission.usuarios.policy=deny
%prod.quarkus.http.auth.permission.gerencia.paths=/contas,/contas/*
%prod.quarkus.http.auth.permission.gerencia.policy=nivel-gerente
%prod.quarkus.http.auth.permission.clientes.paths=/clientes
%prod.quarkus.http.auth.permission.clientes.policy=nivel-supervisor
%prod.quarkus.http.auth.permission.clientes-caixa.paths=/clientes/cpf/*
%prod.quarkus.http.auth.permission.clientes-caixa.policy=nivel-operador
%prod.quarkus.http.auth.permission.nfe.paths=/nfe,/nfe/*
%prod.quarkus.http.auth.permission.nfe.policy=nivel-supervisor
%prod.quarkus.http.auth.permission.nfce-emitir.paths=/nfce/emitir
%prod.quarkus.http.auth.permission.nfce-emitir.methods=POST
%prod.quarkus.http.auth.permission.nfce-emitir.policy=nivel-operador
# caixa: corrigir CPF de nota rejeitada, ver status do emissor e validar CPF
%prod.quarkus.http.auth.permission.nfce-caixa.paths=/nfce/corrigir-cpf/*,/nfce/status,/nfce/cpf/*
%prod.quarkus.http.auth.permission.nfce-caixa.policy=nivel-operador
%prod.quarkus.http.auth.permission.nfce.paths=/nfce,/nfce/*
%prod.quarkus.http.auth.permission.nfce.policy=nivel-supervisor
# Caderno (fiado): operador lança/recebe no caixa; só o gerente cancela/perdoa (checado no código) e vê a lista de devedores completa
%prod.quarkus.http.auth.permission.caderno-devedores.paths=/caderno/devedores,/caderno/*
%prod.quarkus.http.auth.permission.caderno-devedores.policy=nivel-supervisor
%prod.quarkus.http.auth.permission.caderno-perdao.paths=/caderno/perdao
%prod.quarkus.http.auth.permission.caderno-perdao.policy=nivel-gerente
%prod.quarkus.http.auth.permission.caderno-caixa.paths=/caderno/cliente/*,/caderno/lancar,/caderno/pagamento,/caderno/venda/*
%prod.quarkus.http.auth.permission.caderno-caixa.policy=nivel-operador
fruteira.caderno.limite-padrao=${CADERNO_LIMITE_PADRAO:300}

%prod.quarkus.http.auth.permission.fallback.paths=/*
%prod.quarkus.http.auth.permission.fallback.policy=authenticated

# DEV: nenhum Dev Service (Docker) — nem banco, nem Keycloak (a extensão quarkus-oidc tenta subir um Keycloak sozinha)
%dev.quarkus.devservices.enabled=false
%dev.quarkus.keycloak.devservices.enabled=false

# Auditoria: todos os perfis gravam (os serviços repassam o token do usuário); somente o gerente consulta
%prod.quarkus.http.auth.permission.auditoria-gravar.paths=/auditoria
%prod.quarkus.http.auth.permission.auditoria-gravar.methods=POST
%prod.quarkus.http.auth.permission.auditoria-gravar.policy=nivel-operador
%prod.quarkus.http.auth.permission.auditoria-ler.paths=/auditoria,/auditoria/*
%prod.quarkus.http.auth.permission.auditoria-ler.methods=GET,HEAD
%prod.quarkus.http.auth.permission.auditoria-ler.policy=nivel-gerente

# desativar/reativar cliente por id (a consulta por CPF no caixa continua liberada ao operador, por ser mais específica)
%prod.quarkus.http.auth.permission.clientes-id.paths=/clientes/*
%prod.quarkus.http.auth.permission.clientes-id.policy=nivel-supervisor

# Fornecedores: supervisor lista (tela de entrada de mercadoria); só o gerente altera
%prod.quarkus.http.auth.permission.fornecedores-ler.paths=/fornecedores
%prod.quarkus.http.auth.permission.fornecedores-ler.methods=GET,HEAD
%prod.quarkus.http.auth.permission.fornecedores-ler.policy=nivel-supervisor
%prod.quarkus.http.auth.permission.fornecedores-mod.paths=/fornecedores,/fornecedores/*
%prod.quarkus.http.auth.permission.fornecedores-mod.methods=POST,PUT,DELETE
%prod.quarkus.http.auth.permission.fornecedores-mod.policy=nivel-gerente
# Cotações: supervisor registra (na entrada de mercadoria); consulta e manutenção só do gerente
%prod.quarkus.http.auth.permission.cotacoes-registrar.paths=/cotacoes
%prod.quarkus.http.auth.permission.cotacoes-registrar.methods=POST
%prod.quarkus.http.auth.permission.cotacoes-registrar.policy=nivel-supervisor
%prod.quarkus.http.auth.permission.cotacoes-ler.paths=/cotacoes,/cotacoes/*
%prod.quarkus.http.auth.permission.cotacoes-ler.methods=GET,HEAD
%prod.quarkus.http.auth.permission.cotacoes-ler.policy=nivel-gerente
%prod.quarkus.http.auth.permission.cotacoes-mod.paths=/cotacoes/*
%prod.quarkus.http.auth.permission.cotacoes-mod.methods=POST,PUT,DELETE
%prod.quarkus.http.auth.permission.cotacoes-mod.policy=nivel-gerente

# ================= FISCAL (NFC-e / Nota Fiscal Gaúcha) =================
# simulador = NÃO vale fiscalmente (testes) · sefaz = assina com o certificado A1 e transmite à SEFAZ-RS (mTLS)
fruteira.fiscal.provider=${FISCAL_PROVIDER:simulador}
fruteira.fiscal.ambiente=${FISCAL_AMBIENTE:2}
fruteira.fiscal.serie=${FISCAL_SERIE:1}
fruteira.fiscal.numero-inicial=${FISCAL_NUMERO_INICIAL:1}
fruteira.fiscal.cnpj=${FISCAL_CNPJ:}
fruteira.fiscal.razao=${FISCAL_RAZAO:}
fruteira.fiscal.fantasia=${FISCAL_FANTASIA:}
fruteira.fiscal.ie=${FISCAL_IE:}
fruteira.fiscal.crt=${FISCAL_CRT:1}
fruteira.fiscal.logradouro=${FISCAL_LOGRADOURO:}
fruteira.fiscal.numero=${FISCAL_NUMERO:S/N}
fruteira.fiscal.bairro=${FISCAL_BAIRRO:}
fruteira.fiscal.cmun=${FISCAL_CMUN:}
fruteira.fiscal.municipio=${FISCAL_MUNICIPIO:}
fruteira.fiscal.cep=${FISCAL_CEP:}
fruteira.fiscal.cfop=${FISCAL_CFOP:5102}
fruteira.fiscal.csosn=${FISCAL_CSOSN:102}
fruteira.fiscal.csc-id=${FISCAL_CSC_ID:}
fruteira.fiscal.csc=${FISCAL_CSC:}
# Vazio = certificado.pfx na raiz do projeto (pasta atual ou até 3 níveis acima, ou FRUTEIRA_HOME)
fruteira.fiscal.cert-path=${FISCAL_CERT_PATH:}
fruteira.fiscal.cert-senha=${FISCAL_CERT_SENHA:}
fruteira.fiscal.trust-path=${FISCAL_TRUST_PATH:}
fruteira.fiscal.trust-senha=${FISCAL_TRUST_SENHA:}
fruteira.fiscal.url-autorizacao=${FISCAL_URL_AUTORIZACAO:}
fruteira.fiscal.url-consulta=${FISCAL_URL_CONSULTA:}
fruteira.fiscal.url-evento=${FISCAL_URL_EVENTO:}
fruteira.fiscal.url-qr=${FISCAL_URL_QR:https://www.sefaz.rs.gov.br/NFCE/NFCE-COM.aspx}
fruteira.fiscal.url-chave=${FISCAL_URL_CHAVE:www.sefaz.rs.gov.br/nfce/consulta}
fruteira.fiscal.timeout-seg=${FISCAL_TIMEOUT_SEG:20}
# Dados fiscais padrão da loja (cada produto pode ter os seus em Produtos e preços → Fiscal). Defaults de hortifrúti in natura (Simples: CSOSN 102; regime normal: ICMS 40, PIS/COFINS 06 ou 07 — confirme com seu contador).
fruteira.fiscal.im=${FISCAL_IM:}
fruteira.fiscal.nat-op=${FISCAL_NATOP:VENDA DE MERCADORIA}
fruteira.fiscal.origem=${FISCAL_ORIGEM:0}
fruteira.fiscal.cst-icms=${FISCAL_CST_ICMS:40}
fruteira.fiscal.cst-pis=${FISCAL_CST_PIS:07}
fruteira.fiscal.cst-cofins=${FISCAL_CST_COFINS:07}
fruteira.fiscal.aliq-icms=${FISCAL_ALIQ_ICMS:0}
fruteira.fiscal.aliq-pis=${FISCAL_ALIQ_PIS:0}
fruteira.fiscal.aliq-cofins=${FISCAL_ALIQ_COFINS:0}
# IBS/CBS (reforma tributária, NT 2025.002): auto = só no regime normal (CRT 3, obrigatório desde 03/08/2026); on/off forçam. Simples/MEI: facultativo até 04/01/2027.
fruteira.fiscal.ibscbs=${FISCAL_IBSCBS:auto}
fruteira.fiscal.ibscbs-cst=${FISCAL_IBSCBS_CST:}
fruteira.fiscal.ibscbs-cclasstrib=${FISCAL_IBSCBS_CCLASSTRIB:}
fruteira.fiscal.pibs-uf=${FISCAL_PIBS_UF:0.10}
fruteira.fiscal.pibs-mun=${FISCAL_PIBS_MUN:0}
fruteira.fiscal.pcbs=${FISCAL_PCBS:0.90}
# Cartão só entra na nota com os dados do TEF (CNPJ da credenciadora, bandeira, autorização). Vazio = exige quando FISCAL_PROVIDER=sefaz.
fruteira.fiscal.exige-tef=${FISCAL_EXIGE_TEF:}
# NF-e (modelo 55, venda a empresa): série e numeração próprias; webservices próprios (vazio = padrão do RS; confira no portal da SEFAZ-RS)
fruteira.fiscal.url-status=${FISCAL_URL_STATUS:}
fruteira.fiscal.nfe-url-status=${FISCAL_NFE_URL_STATUS:}
fruteira.fiscal.nfe-serie=${FISCAL_NFE_SERIE:1}
fruteira.fiscal.nfe-numero-inicial=${FISCAL_NFE_NUMERO_INICIAL:1}
fruteira.fiscal.nfe-url-autorizacao=${FISCAL_NFE_URL_AUTORIZACAO:}
fruteira.fiscal.nfe-url-consulta=${FISCAL_NFE_URL_CONSULTA:}
fruteira.fiscal.nfe-url-evento=${FISCAL_NFE_URL_EVENTO:}
