quarkus.http.port=8083
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.hibernate-orm.database.generation=update
quarkus.rest-client.catalogo.url=http://localhost:8081
quarkus.rest-client.estoque.url=http://localhost:8082
# PIN do gerente (trocar por Keycloak/OIDC em produção)
fruteira.gerente.pin=1234

# ---- DEV: H2 em arquivo (./data), não precisa de Docker ----
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:file:./data/vendas;DB_CLOSE_DELAY=-1
%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.live-reload.instrumentation=false
# ---- PROD: PostgreSQL (variáveis de ambiente) ----
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/fruteira}
%prod.quarkus.datasource.username=${DB_USER:postgres}
%prod.quarkus.datasource.password=${DB_PASS:fruteira}
