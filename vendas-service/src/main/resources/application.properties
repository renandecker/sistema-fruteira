quarkus.http.port=8083
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
# ---- Banco de dados: o schema é criado/atualizado pelo FLYWAY do retaguarda-service (dono das migrations; precisa subir antes deste). ----
# Aqui o Hibernate só CONFERE (validate): se uma @Entity não bater com o banco, o serviço não sobe. Mudou uma @Entity? Crie a migration com
# ./database/nova-migration.sh vendas "descrição" (ela fica no retaguarda-service). Emergência: DB_SCHEMA_MODE=update.
quarkus.hibernate-orm.database.generation=${DB_SCHEMA_MODE:validate}
quarkus.rest-client.catalogo.url=http://localhost:8081
quarkus.rest-client.estoque.url=http://localhost:8082
# PIN do gerente (trocar por Keycloak/OIDC em produção)
fruteira.gerente.pin=1234
# PIN do supervisor para aprovar sangria (só vale com a aprovação ligada em Caixa; vazio = só o PIN do gerente aprova)
fruteira.supervisor.pin=${SUPERVISOR_PIN:}

# ---- DEV: H2 em arquivo compartilhado (../data/fruteira, igual ao banco único da produção), não precisa de Docker ----
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:file:${H2_ARQUIVO:../data/fruteira};AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.live-reload.instrumentation=false
# ---- PROD: PostgreSQL (variáveis de ambiente) ----
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/fruteira}
%prod.quarkus.datasource.username=${DB_USER:postgres}
%prod.quarkus.datasource.password=${DB_PASS:fruteira}

# ================= SEGURANÇA =================
# DEV: OIDC desligado (sem autenticação nas APIs; o login do front é local)
%dev.quarkus.oidc.enabled=false
%dev.fruteira.seed=true
# PROD: tokens do Keycloak (OIDC). Perfis = realm roles (gerente > supervisor > operador)
%prod.quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:fruteira}
%prod.quarkus.oidc.client-id=${KEYCLOAK_API_CLIENT:fruteira-api}
%prod.quarkus.oidc.application-type=service
%prod.quarkus.oidc.tls.verification=${OIDC_TLS_VERIFICATION:required}
%prod.quarkus.oidc.connection-delay=60S
%prod.quarkus.oidc.roles.role-claim-path=realm_access/roles
%prod.quarkus.http.cors.origins=${FRONT_URL:http://localhost:5173}
# repassa o token do usuário nas chamadas entre microsserviços
%prod.org.eclipse.microprofile.rest.client.propagateHeaders=Authorization
%prod.quarkus.http.auth.policy.nivel-operador.roles-allowed=operador,supervisor,gerente
%prod.quarkus.http.auth.policy.nivel-supervisor.roles-allowed=supervisor,gerente
%prod.quarkus.http.auth.policy.nivel-gerente.roles-allowed=gerente
%prod.quarkus.http.auth.permission.venda.paths=/vendas
%prod.quarkus.http.auth.permission.venda.methods=POST
%prod.quarkus.http.auth.permission.venda.policy=nivel-operador
# Caixa: o operador abre/fecha o turno e faz sangria; os saldos (turnos) são do gerente (também checado no código)
%prod.quarkus.http.auth.permission.caixa.paths=/caixa/turno,/caixa/abrir,/caixa/sangria,/caixa/suprimento,/caixa/fechamento
%prod.quarkus.http.auth.permission.caixa.policy=nivel-operador
# configuração do caixa: todos leem (a tela precisa saber se pede aprovação); só supervisor+ grava
%prod.quarkus.http.auth.permission.caixa-config-ler.paths=/caixa/configuracao
%prod.quarkus.http.auth.permission.caixa-config-ler.methods=GET
%prod.quarkus.http.auth.permission.caixa-config-ler.policy=nivel-operador
%prod.quarkus.http.auth.permission.caixa-config-gravar.paths=/caixa/configuracao
%prod.quarkus.http.auth.permission.caixa-config-gravar.methods=PUT
%prod.quarkus.http.auth.permission.caixa-config-gravar.policy=nivel-supervisor
%prod.quarkus.http.auth.permission.caixa-gerente.paths=/caixa/turnos,/caixa/turnos/*
%prod.quarkus.http.auth.permission.caixa-gerente.policy=nivel-gerente
%prod.quarkus.http.auth.permission.cancelar.paths=/vendas/*
%prod.quarkus.http.auth.permission.cancelar.methods=POST
%prod.quarkus.http.auth.permission.cancelar.policy=nivel-supervisor
%prod.quarkus.http.auth.permission.lista.paths=/vendas
%prod.quarkus.http.auth.permission.lista.methods=GET,HEAD
%prod.quarkus.http.auth.permission.lista.policy=nivel-supervisor
# Validação de CPF (Nota Fiscal Gaúcha): operador; consulta de uma venda (reemissão da NFC-e): supervisor
%prod.quarkus.http.auth.permission.cpf.paths=/vendas/cpf/*
%prod.quarkus.http.auth.permission.cpf.methods=GET
%prod.quarkus.http.auth.permission.cpf.policy=nivel-operador
%prod.quarkus.http.auth.permission.venda-id.paths=/vendas/*
%prod.quarkus.http.auth.permission.venda-id.methods=GET,HEAD
%prod.quarkus.http.auth.permission.venda-id.policy=nivel-supervisor
%prod.quarkus.http.auth.permission.relatorios.paths=/vendas/relatorio/*
%prod.quarkus.http.auth.permission.relatorios.methods=GET,HEAD
%prod.quarkus.http.auth.permission.relatorios.policy=nivel-gerente
%prod.quarkus.http.auth.permission.fallback.paths=/*
%prod.quarkus.http.auth.permission.fallback.policy=authenticated

# DEV: nenhum Dev Service (Docker) — nem banco, nem Keycloak (a extensão quarkus-oidc tenta subir um Keycloak sozinha)
%dev.quarkus.devservices.enabled=false
%dev.quarkus.keycloak.devservices.enabled=false

# Auditoria central
quarkus.rest-client.auditoria.url=${RETAGUARDA_URL:http://localhost:8084}
quarkus.rest-client.auditoria.connect-timeout=2000
quarkus.rest-client.auditoria.read-timeout=3000

# Caderno (fiado) mora no retaguarda-service
quarkus.rest-client.caderno.url=${RETAGUARDA_URL:http://localhost:8084}
quarkus.rest-client.caderno.connect-timeout=2000
quarkus.rest-client.caderno.read-timeout=5000

# Ranking de mais comprados: o PDV (operador) precisa
%prod.quarkus.http.auth.permission.ranking.paths=/vendas/ranking
%prod.quarkus.http.auth.permission.ranking.methods=GET,HEAD
%prod.quarkus.http.auth.permission.ranking.policy=nivel-operador

# TEF: o caixa (operador) inicia, grava resultado, confirma e desfaz; a consulta geral é do supervisor+ (estorno é checado no código)
%prod.quarkus.http.auth.permission.tef-escrever.paths=/tef/*
%prod.quarkus.http.auth.permission.tef-escrever.methods=POST
%prod.quarkus.http.auth.permission.tef-escrever.policy=nivel-operador
%prod.quarkus.http.auth.permission.tef-ler.paths=/tef,/tef/*
%prod.quarkus.http.auth.permission.tef-ler.methods=GET,HEAD
%prod.quarkus.http.auth.permission.tef-ler.policy=nivel-supervisor
%prod.quarkus.http.auth.permission.tef-pendencias.paths=/tef/pendencias
%prod.quarkus.http.auth.permission.tef-pendencias.methods=GET,HEAD
%prod.quarkus.http.auth.permission.tef-pendencias.policy=nivel-operador

# ================= PIX =================
# Configuração mapeada em PixConfig. PIX_PROVIDER: SIMULADOR (testes) | EFI | MERCADO_PAGO | ASAAS | ITAU | BRADESCO | SICOOB | SICREDI
smallrye.config.mapping.validate-unknown=false
pix.provider=${PIX_PROVIDER:simulador}
pix.chave=${PIX_CHAVE:}
pix.nome=${PIX_NOME:FRUTEIRA CONVENTOS}
pix.cidade=${PIX_CIDADE:CIDADE}
pix.expiracao-seg=${PIX_EXPIRACAO_SEG:300}
pix.webhook.segredo=${FRUTEIRA_PIX_WEBHOOK_SEGREDO:}
pix.webhook.url=${FRUTEIRA_PIX_WEBHOOK_URL:}
# Ngrok (desenvolvimento/testes com Pix real): NGROK_URL fixa o endereço do túnel; sem ela, em dev o serviço pergunta ao agente local do Ngrok (4040).
pix.webhook.ngrok-url=${NGROK_URL:}
%dev.pix.webhook.ngrok-api=${NGROK_API:http://127.0.0.1:4040/api/tunnels}
%prod.pix.webhook.ngrok-api=${NGROK_API:}
pix.webhook.ngrok-caminho=${NGROK_CAMINHO:/pix/webhook}
pix.webhook.ngrok-porta=${NGROK_PORTA:8083}
pix.webhook.auto-registrar=${PIX_WEBHOOK_AUTO_REGISTRAR:false}
pix.simulador.pagar-em-seg=${PIX_SIM_PAGAR_EM_SEG:6}
# --- efi (API Pix padrão Bacen) ---
pix.efi.base-url=${PIX_EFI_URL:}
pix.efi.token-url=${PIX_EFI_TOKEN_URL:}
pix.efi.client-id=${PIX_EFI_CLIENT_ID:}
pix.efi.client-secret=${PIX_EFI_CLIENT_SECRET:}
pix.efi.token-formato=${PIX_EFI_TOKEN_FORMATO:}
pix.efi.escopos=${PIX_EFI_ESCOPOS:}
pix.efi.cabecalhos=${PIX_EFI_CABECALHOS:}
pix.efi.prefixo-api=${PIX_EFI_PREFIXO_API:}
pix.efi.caminho-cob=${PIX_EFI_CAMINHO_COB:}
pix.efi.chave=${PIX_EFI_CHAVE:}
pix.efi.certificado=${PIX_EFI_CERTIFICADO:}
pix.efi.certificado-senha=${PIX_EFI_CERTIFICADO_SENHA:}
pix.efi.skip-mtls-webhook=${PIX_EFI_SKIP_MTLS_WEBHOOK:false}
# --- itau (API Pix padrão Bacen) ---
pix.itau.base-url=${PIX_ITAU_URL:}
pix.itau.token-url=${PIX_ITAU_TOKEN_URL:}
pix.itau.client-id=${PIX_ITAU_CLIENT_ID:}
pix.itau.client-secret=${PIX_ITAU_CLIENT_SECRET:}
pix.itau.token-formato=${PIX_ITAU_TOKEN_FORMATO:}
pix.itau.escopos=${PIX_ITAU_ESCOPOS:}
pix.itau.cabecalhos=${PIX_ITAU_CABECALHOS:}
pix.itau.prefixo-api=${PIX_ITAU_PREFIXO_API:}
pix.itau.caminho-cob=${PIX_ITAU_CAMINHO_COB:}
pix.itau.chave=${PIX_ITAU_CHAVE:}
pix.itau.certificado=${PIX_ITAU_CERTIFICADO:}
pix.itau.certificado-senha=${PIX_ITAU_CERTIFICADO_SENHA:}
pix.itau.skip-mtls-webhook=${PIX_ITAU_SKIP_MTLS_WEBHOOK:false}
# --- bradesco (API Pix padrão Bacen) ---
pix.bradesco.base-url=${PIX_BRADESCO_URL:}
pix.bradesco.token-url=${PIX_BRADESCO_TOKEN_URL:}
pix.bradesco.client-id=${PIX_BRADESCO_CLIENT_ID:}
pix.bradesco.client-secret=${PIX_BRADESCO_CLIENT_SECRET:}
pix.bradesco.token-formato=${PIX_BRADESCO_TOKEN_FORMATO:}
pix.bradesco.escopos=${PIX_BRADESCO_ESCOPOS:}
pix.bradesco.cabecalhos=${PIX_BRADESCO_CABECALHOS:}
pix.bradesco.prefixo-api=${PIX_BRADESCO_PREFIXO_API:}
pix.bradesco.caminho-cob=${PIX_BRADESCO_CAMINHO_COB:}
pix.bradesco.chave=${PIX_BRADESCO_CHAVE:}
pix.bradesco.certificado=${PIX_BRADESCO_CERTIFICADO:}
pix.bradesco.certificado-senha=${PIX_BRADESCO_CERTIFICADO_SENHA:}
pix.bradesco.skip-mtls-webhook=${PIX_BRADESCO_SKIP_MTLS_WEBHOOK:false}
# --- sicoob (API Pix padrão Bacen) ---
pix.sicoob.base-url=${PIX_SICOOB_URL:}
pix.sicoob.token-url=${PIX_SICOOB_TOKEN_URL:}
pix.sicoob.client-id=${PIX_SICOOB_CLIENT_ID:}
pix.sicoob.client-secret=${PIX_SICOOB_CLIENT_SECRET:}
pix.sicoob.token-formato=${PIX_SICOOB_TOKEN_FORMATO:}
pix.sicoob.escopos=${PIX_SICOOB_ESCOPOS:}
pix.sicoob.cabecalhos=${PIX_SICOOB_CABECALHOS:}
pix.sicoob.prefixo-api=${PIX_SICOOB_PREFIXO_API:}
pix.sicoob.caminho-cob=${PIX_SICOOB_CAMINHO_COB:}
pix.sicoob.chave=${PIX_SICOOB_CHAVE:}
pix.sicoob.certificado=${PIX_SICOOB_CERTIFICADO:}
pix.sicoob.certificado-senha=${PIX_SICOOB_CERTIFICADO_SENHA:}
pix.sicoob.skip-mtls-webhook=${PIX_SICOOB_SKIP_MTLS_WEBHOOK:false}
# --- sicredi (API Pix padrão Bacen) ---
pix.sicredi.base-url=${PIX_SICREDI_URL:}
pix.sicredi.token-url=${PIX_SICREDI_TOKEN_URL:}
pix.sicredi.client-id=${PIX_SICREDI_CLIENT_ID:}
pix.sicredi.client-secret=${PIX_SICREDI_CLIENT_SECRET:}
pix.sicredi.token-formato=${PIX_SICREDI_TOKEN_FORMATO:}
pix.sicredi.escopos=${PIX_SICREDI_ESCOPOS:}
pix.sicredi.cabecalhos=${PIX_SICREDI_CABECALHOS:}
pix.sicredi.prefixo-api=${PIX_SICREDI_PREFIXO_API:}
pix.sicredi.caminho-cob=${PIX_SICREDI_CAMINHO_COB:}
pix.sicredi.chave=${PIX_SICREDI_CHAVE:}
pix.sicredi.certificado=${PIX_SICREDI_CERTIFICADO:}
pix.sicredi.certificado-senha=${PIX_SICREDI_CERTIFICADO_SENHA:}
pix.sicredi.skip-mtls-webhook=${PIX_SICREDI_SKIP_MTLS_WEBHOOK:false}
# --- mercado-pago (API própria /v1/payments) ---
pix.mercado-pago.base-url=${PIX_MERCADO_PAGO_URL:}
pix.mercado-pago.access-token=${PIX_MERCADO_PAGO_ACCESS_TOKEN:}
pix.mercado-pago.email-pagador=${PIX_MERCADO_PAGO_EMAIL_PAGADOR:}
pix.mercado-pago.cpf-pagador=${PIX_MERCADO_PAGO_CPF_PAGADOR:}
# --- asaas (API própria /v3) ---
pix.asaas.base-url=${PIX_ASAAS_URL:}
pix.asaas.api-key=${PIX_ASAAS_API_KEY:}
pix.asaas.cliente-id=${PIX_ASAAS_CLIENTE_ID:}
pix.asaas.email-webhook=${PIX_ASAAS_EMAIL_WEBHOOK:}
fruteira.pix.obrigatorio=${FRUTEIRA_PIX_OBRIGATORIO:false}

# Pix: o webhook do PSP é PÚBLICO (protegido por segredo); o restante exige login
%prod.quarkus.http.auth.permission.pix-webhook.paths=/pix/webhook
%prod.quarkus.http.auth.permission.pix-webhook.policy=permit
%prod.quarkus.http.auth.permission.pix-caixa.paths=/pix/cobrancas,/pix/cobrancas/*,/pix/simulador/*,/pix/pendencias,/pix/status
%prod.quarkus.http.auth.permission.pix-caixa.methods=POST,GET,HEAD
%prod.quarkus.http.auth.permission.pix-caixa.policy=nivel-operador
%prod.quarkus.http.auth.permission.pix-registrar.paths=/pix/webhook/registrar
%prod.quarkus.http.auth.permission.pix-registrar.methods=POST
%prod.quarkus.http.auth.permission.pix-registrar.policy=nivel-gerente

# NCM nos itens: exigido em venda com TEF (padrão) e, se quiser, em toda venda
fruteira.ncm.obrigatorio-tef=${FRUTEIRA_NCM_OBRIGATORIO_TEF:true}
fruteira.ncm.obrigatorio=${FRUTEIRA_NCM_OBRIGATORIO:false}

# Sangria: saldo da gaveta a partir do qual o PDV recomenda uma sangria (R$)
fruteira.caixa.limite-gaveta=${CAIXA_LIMITE_GAVETA:500}

# ---- Saúde dos pagamentos: rotina agendada que confere o Pix (PIX_PROVIDER) e o TEF (TEF_PROVIDER; vazio ou "nenhum" = não confere) ----
# SAUDE_INTERVALO: de quanto em quanto tempo (1h, 30m, 15m, 2h...). "off" desliga. SAUDE_PRIMEIRA_EM: atraso da 1ª conferência depois da partida.
fruteira.saude.agendado=${SAUDE_AGENDADO:true}
fruteira.saude.intervalo=${SAUDE_INTERVALO:1h}
fruteira.saude.primeira-em=${SAUDE_PRIMEIRA_EM:1m}
fruteira.saude.historico=${SAUDE_HISTORICO:48}
fruteira.saude.tef-provedor=${TEF_PROVIDER:}
fruteira.saude.tef-url=${SAUDE_TEF_URL:http://127.0.0.1:8090}
fruteira.saude.tef-token=${TEF_TOKEN:}
%prod.quarkus.http.auth.permission.saude-ler.paths=/saude/pagamentos
%prod.quarkus.http.auth.permission.saude-ler.methods=GET
%prod.quarkus.http.auth.permission.saude-ler.policy=nivel-operador
%prod.quarkus.http.auth.permission.saude-verificar.paths=/saude/pagamentos/verificar
%prod.quarkus.http.auth.permission.saude-verificar.policy=nivel-supervisor
